version: '3.8'
services:
  supabase-all-in-one:
    image: supabase/postgres:15.1.1.78
    container_name: supabase-standalone
    environment:
      POSTGRES_PASSWORD: buyticle
      JWT_SECRET: jksdfhksdfldjflhslfhljskhflsjhgsdjfhgskjg
    # On expose les ports pour être sûr de bypasser les bugs de proxy
    ports:
      - "5432:5432" # Database directe
      - "3000:3000" # Studio (Interface)
      - "8000:8000" # API (PostgREST)
    volumes:
      - supabase_data:/var/lib/postgresql/data
    restart: always

volumes:
  supabase_data: