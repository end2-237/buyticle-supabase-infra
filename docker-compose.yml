version: '3.8'
services:
  supabase:
    image: supabase/postgres:14.1.0
    container_name: supabase-standalone
    environment:
      POSTGRES_PASSWORD: buyticle
      JWT_SECRET: jksdfhksdfldjflhslfhljskhflsjhgsdjfhgskjg
    ports:
      - "5433:5432" # On passe sur 5433 au cas où
      - "3001:3000" # ON CHANGE 3000 PAR 3001
      - "8001:8000" # ON CHANGE 8000 PAR 8001
    volumes:
      - supabase_data_new:/var/lib/postgresql/data
    restart: always

volumes:
  supabase_data_new: