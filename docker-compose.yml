version: '3.8'

services:
  db:
    image: postgres:15-bookworm
    container_name: supabase-db
    environment:
      POSTGRES_PASSWORD: buyticle
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase_db_final:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build:
      context: .
      dockerfile: Dockerfile.postgrest
    container_name: supabase-rest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:3000"

  meta:
    build:
      context: .
      dockerfile: Dockerfile.meta
    container_name: supabase-meta
    depends_on:
      db:
        condition: service_healthy

  storage:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: supabase-storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - supabase_storage:/var/lib/storage
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: supabase-imgproxy
    environment:
      IMGPROXY_BIND: :8080
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
    volumes:
      - supabase_storage:/var/lib/storage:ro

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    container_name: supabase-studio
    depends_on:
      - rest
      - meta
      - storage
    ports:
      - "3001:3000"

volumes:
  supabase_db_final:
    external: true
  supabase_storage:
    driver: local