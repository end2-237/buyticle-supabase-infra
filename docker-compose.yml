version: '3.8'

services:
  db:
    image: postgres:15-bookworm
    container_name: supabase-db
    environment:
      POSTGRES_PASSWORD: buyticle
    volumes:
      - supabase_db_final:/var/lib/postgresql/data
    networks:
      - supabase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rest:
    image: postgrest/postgrest:v12.2.0   # version Debian, pas distroless
    container_name: supabase-rest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:3000"
    volumes:
      - /etc/passwd:/etc/passwd:ro       # ← correctif clé
      - /etc/group:/etc/group:ro
    environment:
      PGRST_DB_URI: postgres://postgres:buyticle@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: jksdfhksdfldjflhslfhljskhflsjhgsdjfhgskjg
      PGRST_DB_ANON_ROLE: postgres
    networks:
      - supabase-network

  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: supabase-meta
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: buyticle
    networks:
      - supabase-network

  studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    depends_on:
      - rest
      - meta
    ports:
      - "3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://rest:3000
      SUPABASE_REST_URL: http://rest:3000
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTYxMzUzMTk4NSwiZXhwIjoxOTI5MTA3OTg1fQ.ReTn6NAsHBnFMRMCeHFR7BPNLVH2JWn7EBl7CXqpKZE
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjEzNTMxOTg1LCJleHAiOjE5MjkxMDc5ODV9.FhTDMkNPSEt6Jbfa1T5nN9ZJEf1SHvNxVwqpVYj3INk
      STUDIO_DEFAULT_ORGANIZATION: "Buyticle"
      STUDIO_DEFAULT_PROJECT: "Inventaire"
      POSTGRES_PASSWORD: buyticle
      SUPABASE_FUNCTIONS_URL: ""
    networks:
      - supabase-network

networks:
  supabase-network:
    driver: bridge

volumes:
  supabase_db_final: